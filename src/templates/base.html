  <!-- Latest compiled and minified CSS -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Poppins:300,400,500,600,700">
  <link rel="stylesheet" href="/static/assets/fonts/font-awesome.css" type="text/css">

   <link href="/static/assets/css/app.css" rel="stylesheet" type="text/css">

    href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-datepicker/1.9.0/css/bootstrap-datepicker.min.css">

</head>

<body>
  {% block sidebar %}{% endblock %}
  {% block header %}{% endblock %}
  {% block body %}{% endblock %}
  {% block js_footer %}
  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
  <!-- Toastr js -->
  <script src="/static/assets/plugins/toastr/toastr.min.js"></script>
  <!-- Sweet-Alert  -->
  <script src="/static/assets/plugins/bootstrap-sweetalert/sweet-alert.min.js"></script>
  <!-- Parsleyjs -->
  <script src="/static/assets/plugins/parsleyjs/parsley.min.js"></script>
  <script>
    (function ($) {
      toastr.options = {
        "closeButton": true,
        "debug": false,
        "newestOnTop": true,
        "progressBar": true,
        "positionClass": "toast-bottom-right",
        "preventDuplicates": false,
        "onclick": null,
        "showDuration": "300",
        "hideDuration": "1000",
        "timeOut": "2000",
        "extendedTimeOut": "1000",
        "showEasing": "swing",
        "hideEasing": "linear",
        "showMethod": "fadeIn",
        "hideMethod": "fadeOut"
      };
      $.fn.serializeObject = function () {
        var self = this,
          json = {},
          push_counters = {},
          patterns = {
            "validate": /^[a-zA-Z][a-zA-Z0-9_]*(?:\[(?:\d*|[a-zA-Z0-9_]+)\])*$/,
            "key": /[a-zA-Z0-9_]+|(?=\[\])/g,
            "push": /^$/,
            "fixed": /^\d+$/,
            "named": /^[a-zA-Z0-9_]+$/
          };


        this.build = function (base, key, value) {
          base[key] = value;
          return base;
        };

        this.push_counter = function (key) {
          if (push_counters[key] === undefined) {
            push_counters[key] = 0;
          }
          return push_counters[key]++;
        };

        $.each($(this).serializeArray(), function () {

          // Skip invalid keys
          if (!patterns.validate.test(this.name)) {
            return;
          }

          var k,
            keys = this.name.match(patterns.key),
            merge = this.value,
            reverse_key = this.name;

          while ((k = keys.pop()) !== undefined) {

            // Adjust reverse_key
            reverse_key = reverse_key.replace(new RegExp("\\[" + k + "\\]$"), '');

            // Push
            if (k.match(patterns.push)) {
              merge = self.build([], self.push_counter(reverse_key), merge);
            }

            // Fixed
            else if (k.match(patterns.fixed)) {
              merge = self.build([], k, merge);
            }

            // Named
            else if (k.match(patterns.named)) {
              merge = self.build({}, k, merge);
            }
          }

          json = $.extend(true, json, merge);
        });

        return json;
      };
    })(jQuery);
  </script>
  {% endblock %}
</body>

</html>
