{% import 'form/models/abi.html' as abi_lib with context %}
<div style="  position: fixed;   top: 100px; right: 0;   width: fit-content;  z-index: 100000; " id="msg_nft_detail">

</div>
<div id="abi_lock_page">

</div>
{{ abi_lib.script_abi() }}

<script>
    var abi = {{ factory_abi | tojson(indent=2) }}
    var address = "{{ factory_address }}"
    var address_of_collections = {{ address_of_collections | tojson(indent=2) }}
    var factoryContract = null;
    var before_price = {{ before_price }}
    var before_is_show = {{ before_is_show | tojson(indent=2)  }}

    if(before_is_show) {
        before_is_show = "y"
    } else {
       before_is_show = null
    }

    async function addNewNftRarities(_nftCollection, prices) {
        try {
            $("#abi_lock_page").html('<div id="lock_page" style=" position: fixed; width: 100vw; height: 100vh; z-index: 10000000000000000; background: rgba(207,207,207, 0.4); top: 0; left: 0; display: flex; justify-content: center; align-content: center; align-items: center; "> <section style="background: white; margin: 16px; padding: 16px; border-radius: 10px; text-align: center;"  role="status"> <div style="display: flex; align-items: center; justify-content: center;"> <i style="  font-size: 40px;" class="fa fa-circle-o-notch fa-spin"></i> </div> <i>Please do not leave or close the window.</i> <h3 id="process_text">Loading...</h3> </section> </div>')
            if(!factoryContract) {
                factoryContract =  await initSignerContract(address, abi)
            }

            let _prices =  prices.map(_item=>ethers.utils.parseEther(_item))

            $("#process_text").text("Sign tx......")
            console.log(_nftCollection, _prices)
            var result = await factoryContract.AddNewNftRarities(ethers.utils.getAddress(_nftCollection) , _prices);
            console.log(result)

            $("#process_text").text("Wait tx "+ result.hash +"......")
            var tx = await result.wait()
            console.log(tx)

            tx.events.forEach(event=>{
                  if(event.event==='AddNewNftRariies') {
                        console.log(event.args[3])
                        $("#rarity").val(event.args[3])
                  }
            })


            $("#process_text").html('<div  class="alert alert-success" role="alert"> Successfully </div>')
            return true;
        } catch(e) {
           console.error(e)
           console.log(e.data?.message)
           console.log(e.toString())
           console.log(e.data?.message)
           var msg = e.data?.message || e.toString() || "Internal JSON-RPC error."
           $("#msg_nft_detail").html('<div   class="alert alert-danger" role="alert">' + msg + ' </div>')
           console.error(e)
           $("#abi_lock_page").html('')
        }
        return false;
    }



    async function configMesh(_nftCollection, _rarity, _meshIndex, _newPrice) {
        try {
            $("#abi_lock_page").html('<div id="lock_page" style=" position: fixed; width: 100vw; height: 100vh; z-index: 10000000000000000; background: rgba(207,207,207, 0.4); top: 0; left: 0; display: flex; justify-content: center; align-content: center; align-items: center; "> <section style="background: white; margin: 16px; padding: 16px; border-radius: 10px; text-align: center;"  role="status"> <div style="display: flex; align-items: center; justify-content: center;"> <i style="  font-size: 40px;" class="fa fa-circle-o-notch fa-spin"></i> </div> <i>Please do not leave or close the window.</i> <h3 id="process_text">Loading...</h3> </section> </div>')
            if(!factoryContract) {
                factoryContract =  await initSignerContract(address, abi)
            }

            let _price =  ethers.utils.parseEther(String(_newPrice))
            _nftCollection = ethers.utils.getAddress(_nftCollection)
            $("#process_text").text("Sign tx......")
            console.log(_nftCollection, _rarity, _price)
            var result = await factoryContract.configMesh(ethers.utils.getAddress(_nftCollection), _rarity , _meshIndex,_price);
            console.log(result)

            $("#process_text").text("Wait tx "+ result.hash +"......")
            var tx = await result.wait()
            console.log(tx)

            $("#process_text").html('<div  class="alert alert-success" role="alert"> Successfully </div>')
            return true;
        } catch(e) {
           console.error(e)
           console.log(e.data?.message)
           console.log(e.toString())
           console.log(e.data?.message)
           var msg = e.data?.message || e.toString() || "Internal JSON-RPC error."
           $("#msg_nft_detail").html('<div   class="alert alert-danger" role="alert">' + msg + ' </div>')
           console.error(e)
           $("#abi_lock_page").html('')
        }
        return false;
    }


    $( document ).ready(function() {
        $("#collection_create_rarity").submit(async function(event){
                event.preventDefault();
                var _fields = $(this).serializeArray()
                console.log(_fields)
                var price = null;
                var collection_id = null;
                var description = null
                var name= null;
                var rarity_code = null;

                for(const _field of _fields) {
                    if(_field.name == 'price') {
                        price = _field.value
                    }
                    if(_field.name == 'collection_id') {
                        collection_id = _field.value
                    }
                    if(_field.name == 'description') {
                        description = _field.value
                    }
                    if(_field.name == 'name') {
                        name = _field.value
                    }
                    if(_field.name == 'rarity_code') {
                        rarity_code = _field.value
                    }
                }
                var cid = await createMetadata(description, name, rarity_code);
                if(cid) {
                    var collection = address_of_collections.find(v=>v[0]==collection_id)

                    console.log(collection)

                    var res = await addNewNftRarities(
                        collection[1], [price]
                    )

                    console.log("res", res)
                    if(res) {
                      $(this).unbind('submit').submit();
                    }
                }
        })
        console.log(before_is_show)
        console.log(before_price)

        $("#mesh_edit").submit(async function(event){
                event.preventDefault();
                var _fields = $(this).serializeArray()
                console.log(_fields)

                var price = null;
                var is_show = null;
                var submit = true;
                var collection_address = null;
                var rarity =  null;
                var mesh_index = null;

                for(const _field of _fields) {
                    if(_field.name == 'price') {
                        price = Number(_field.value)
                    }
                    if(_field.name == 'is_show') {
                        is_show = _field.value
                    }
                    if(_field.name == 'address') {
                        collection_address = _field.value
                    }
                    if(_field.name == 'rarity') {
                        rarity = _field.value
                    }
                    if(_field.name == 'mesh_index') {
                        mesh_index = _field.value
                    }
                }

                console.log(before_is_show, is_show)
                console.log(before_price, price, collection_address)

                if(is_show !== before_is_show) {
                    console.log("Set show")
                    if(is_show) {
                       submit = await configMesh(collection_address, rarity, mesh_index, price);
                    } else {
                       submit = await configMesh(collection_address, rarity, mesh_index, 10000000);
                    }

                } else {

                   if(before_price !== price) {
                      console.log("Set price")
                      submit = await configMesh(collection_address, rarity, mesh_index, price);
                   }

                }

                if(submit) {
                   $(this).unbind('submit').submit();
                }

        })

    });





</script>
