{% extends 'admin/model/list.html' %}

{% block body %}
<section class="content">
    <div class="table-responsive">
        <div class="row">
            <div class="col-lg-12 col-xs-12">
                <!-- small box -->
                <div class="small-box bg-white">
                    <div class="inner">
                        <h1 class="text-center text-bold"> {{ data|sum(attribute='total') }} USD </h1>
                    </div>
                    <div class="icon">
                        <i class="ion ion-pie-graph"></i>
                    </div>
                    <span class="small-box-footer">
                        <p>Total</p>
                    </span>
                </div>
            </div>
        </div>
        <div class="row">
            {% for row in data %}
            <div class="col-lg-3 col-xs-6">
                <!-- small box -->
                <div class="small-box bg-white">
                    <div class="inner">
                        <h3>{{ get_value(row, 'total') }} USD</h3>
                        <p></p>
                    </div>
                    <div class="icon">
                        <i class="ion ion-cash"></i>
                    </div>
                    <a href="#" class="small-box-footer">Type: {{ get_value(row, 'nft_type')}} - Rarity: {{
                        get_value(row, 'rarity')}}</a>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
{% endblock %}
