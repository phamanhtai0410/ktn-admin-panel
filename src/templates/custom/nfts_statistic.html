{% extends 'admin/model/list.html' %}

{% block body %}
<section class="content">
    <div class="table-responsive">
        <div class="row">
            <div class="col-lg-12 col-xs-12">
                <!-- small box -->
                <div class="small-box bg-green">
                    <div class="inner">
                        <h1 class="text-center text-bold"> {{ data|sum(attribute='total') }} USD </h1>
                    </div>
                    <div class="icon">
                        <i class="ion ion-pie-graph"></i>
                    </div>
                    <spans class="small-box-footer">
                        <h3>Total</h3></span>
                </div>
            </div>
        </div>
        <div class="row">
            {% for row in data %}
            <div class="col-lg-3 col-xs-6">
                <!-- small box -->
                <div class="small-box bg-green">
                    <div class="inner">
                        <h3 class="text-center"> {{ get_value(row, 'total') }} USD </h3>
                    </div>
                    <div class="icon">
                        <i class="ion ion-cash"></i>
                    </div>
                    <spans class="small-box-footer">
                        <p>Type: {{ get_value(row, 'nft_type')}} - Rarity: {{ get_value(row, 'rarity')}}</p></span>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
{% endblock %}
